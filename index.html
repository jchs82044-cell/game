<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>웹 턴제 배틀 게임</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <h1>BATTLE ARENA</h1>
        
        <div class="battle-field">
            <div class="fighter enemy-side">
                <div class="status-box">
                    <span id="enemy-name">적 몬스터</span>
                    <div class="hp-bar-container">
                        <div id="enemy-hp" class="hp-bar" style="width: 100%;"></div>
                    </div>
                    <span id="enemy-hp-text">100 / 100</span>
                </div>
                <div class="sprite enemy-sprite">👾</div>
            </div>

            <div class="fighter player-side">
                <div class="sprite player-sprite">🤖</div>
                <div class="status-box">
                    <span id="player-name">나의 몬스터</span>
                    <div class="hp-bar-container">
                        <div id="player-hp" class="hp-bar" style="width: 100%;"></div>
                    </div>
                    <span id="player-hp-text">100 / 100</span>
                </div>
            </div>
        </div>

        <div class="control-panel">
            <div id="battle-log" class="log-box">배틀이 시작되었습니다! 기술을 선택하세요.</div>
            <div class="button-group">
                <button onclick="useSkill(0)" class="skill-btn">기술 1 (위력: 30)</button>
                <button onclick="useSkill(1)" class="skill-btn">기술 2 (위력: 50)</button>
                <button onclick="useSkill(2)" class="skill-btn">회복약 (체력 회복)</button>
                <button onclick="resetGame()" class="reset-btn">다시 시작</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
